name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A second push to the same branch cancels the run in flight: the older result
# is about to be superseded anyway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # `lib/access-url.ts` throws without it. Nothing imports that module since
      # the routes moved into `lib/routes.ts`, so this only keeps the old guard
      # satisfied; retiring both is pending cleanup.
      NEXT_PUBLIC_ACCESS_URL: https://acceso.test/acceso

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Every step below fails the job. They are ordered cheapest first, so a
      # type error is reported in seconds rather than after a browser download.
      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # The end-to-end suites sign in for real, so they need the local instance
      # up and seeded. `supabase/config.toml` pins the 553xx ports the runner
      # binds here, the same ones `.env` points at. `db reset` applies the
      # migrations and `supabase/seed.sql`, which is where the test account
      # comes from; without it every sign-in fails on correct credentials.
      - name: Start Supabase
        run: |
          supabase start
          supabase db reset

      # This one command carries the end-to-end suites and the accessibility
      # audit: a violation reported by axe fails the job here (9.6).
      - name: End-to-end and accessibility audit
        run: npm run test:e2e

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
