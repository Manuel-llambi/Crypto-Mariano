<!--
  The same code, for an address that already has an account (7.2).

  Supabase sends `confirmation` to an address it has never seen and this one to
  an address it already knows, so the two exist to say the same thing. They are
  deliberately not one file: the CLI declares them under two separate tables,
  and wiring up only one is the silent half-failure of 7.1.

  Nothing here names which of the two cases happened. Both templates say the
  same thing for the same reason the screens do (1.3): a message that read
  «welcome back» would tell whoever typed the address whether it is registered.
-->
